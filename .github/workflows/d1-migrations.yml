name: Apply D1 migrations (preview)

on:
  push:
    branches:
      - feature/ta2lk-agent-foundation
    paths:
      - ".github/workflows/d1-migrations.yml"
      - "migrations/**"
      - "wrangler.jsonc"
      - "wrangler.preview-migrations.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ta2lk-d1-migrations-preview
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply database migrations to isolated preview D1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out development branch
        uses: actions/checkout@v5
        with:
          ref: feature/ta2lk-agent-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply D1 migrations to remote development database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4.136.1 d1 migrations apply PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc

      - name: Verify all memory tables exist in preview D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx --yes wrangler@4.136.1 d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --command "SELECT CASE WHEN COUNT(DISTINCT name) = 5 THEN 'PASS' ELSE 'FAIL' END AS verification FROM sqlite_master WHERE type = 'table' AND name IN ('conversations', 'messages', 'memory_facts', 'skill_sources', 'agent_change_log');")"
          printf '%s\\n' "$output"
          if ! printf '%s' "$output" | grep -q "PASS"; then
            echo "::error::Preview D1 is missing one or more required memory tables."
            exit 1
          fi
          echo "All five TA2LK memory tables are present in the isolated preview database."
