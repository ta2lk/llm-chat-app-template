name: Apply D1 migrations (preview)

on:
  push:
    branches:
      - feature/ta2lk-agent-foundation
    paths:
      - ".github/workflows/d1-migrations.yml"
      - "migrations/**"
      - "wrangler.jsonc"
      - "wrangler.preview-migrations.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ta2lk-d1-migrations-preview
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply database migrations to isolated preview D1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: feature/ta2lk-agent-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply D1 migrations to remote development database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4.136.1 d1 migrations apply PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc
