name: Validate TA2LK agent (development)

on:
  push:
    branches:
      - feature/ta2lk-agent-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ta2lk-agent-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check and Worker dry run
        run: npm run check
      - name: Run tests
        run: npm test -- --run
