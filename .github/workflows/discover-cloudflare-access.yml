name: Discover Cloudflare Access configuration

on:
  push:
    branches:
      - feature/ta2lk-agent-foundation
    paths:
      - .github/workflows/discover-cloudflare-access.yml
      - src/index.ts
      - wrangler.jsonc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect Cloudflare account and Access configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          api() {
            local url="$1"
            local body_file
            body_file=$(mktemp)
            HTTP_STATUS=$(curl --silent --show-error \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --output "$body_file" \
              --write-out '%{http_code}' "$url")
            API_BODY=$(cat "$body_file")
            rm -f "$body_file"
          }

          api_error_summary() {
            printf '%s' "$API_BODY" | jq -c '{success,errors,messages}' 2>/dev/null || printf '%s' 'non-JSON response'
          }

          echo "## Cloudflare Access discovery" >> "$GITHUB_STEP_SUMMARY"
          echo "Checking account access..." 

          api "https://api.cloudflare.com/client/v4/accounts"
          if [ "$HTTP_STATUS" != "200" ] || ! printf '%s' "$API_BODY" | jq -e '.success == true' >/dev/null; then
            diagnostic="$(api_error_summary)"
            echo "::error title=Cloudflare account discovery failed::HTTP $HTTP_STATUS — $diagnostic"
            {
              echo "Could not list Cloudflare accounts."
              echo "- HTTP status: $HTTP_STATUS"
              echo "- API diagnostic: $diagnostic"
              echo "- Check that the token has Account > Account Settings > Read and access to the intended account."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          accounts="$API_BODY"
          echo "Cloudflare account listing succeeded."
          echo "Account names and IDs:" >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$accounts" | jq -r '.result[] | "- " + .name + " (ID: " + .id + ")"' >> "$GITHUB_STEP_SUMMARY"

          access_errors=0
          while IFS= read -r account_id; do
            [ -n "$account_id" ] || continue
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Account $account_id" >> "$GITHUB_STEP_SUMMARY"

            api "https://api.cloudflare.com/client/v4/accounts/$account_id/access/apps"
            echo "Access applications endpoint: HTTP $HTTP_STATUS"
            echo "#### Access applications (HTTP $HTTP_STATUS)" >> "$GITHUB_STEP_SUMMARY"
            if [ "$HTTP_STATUS" = "200" ] && printf '%s' "$API_BODY" | jq -e '.success == true' >/dev/null; then
              printf '%s' "$API_BODY" | jq -r 'if (.result|length) == 0 then "- No Access applications found" else (.result[] | "- " + (.name // "unnamed") + " | " + (.domain // "no-domain") + " | " + (.type // "unknown") + " | " + .id) end' >> "$GITHUB_STEP_SUMMARY"
            else
              access_errors=$((access_errors + 1))
              diagnostic="$(api_error_summary)"
              echo "::warning title=Cloudflare Access applications lookup::HTTP $HTTP_STATUS — $diagnostic"
              echo "API diagnostic: $diagnostic" >> "$GITHUB_STEP_SUMMARY"
            fi

            api "https://api.cloudflare.com/client/v4/accounts/$account_id/access/organizations"
            echo "Access organization endpoint: HTTP $HTTP_STATUS"
            echo "#### Access organization (HTTP $HTTP_STATUS)" >> "$GITHUB_STEP_SUMMARY"
            if [ "$HTTP_STATUS" = "200" ] && printf '%s' "$API_BODY" | jq -e '.success == true' >/dev/null; then
              printf '%s' "$API_BODY" | jq -r '"Access team domain: " + (.result.auth_domain // "not configured")' >> "$GITHUB_STEP_SUMMARY"
            else
              access_errors=$((access_errors + 1))
              diagnostic="$(api_error_summary)"
              echo "::warning title=Cloudflare Access organization lookup::HTTP $HTTP_STATUS — $diagnostic"
              echo "API diagnostic: $diagnostic" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(printf '%s' "$accounts" | jq -r '.result[].id')

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Discovery only: no Access applications, policies, or production settings were changed." >> "$GITHUB_STEP_SUMMARY"
          if [ "$access_errors" -gt 0 ]; then
            echo "Access discovery completed with $access_errors API error(s); see endpoint diagnostics above." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Cloudflare Access discovery completed without API errors."
