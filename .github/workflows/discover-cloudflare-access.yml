name: Discover Cloudflare Access configuration

on:
  push:
    branches:
      - feature/ta2lk-agent-foundation
    paths:
      - .github/workflows/discover-cloudflare-access.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Cloudflare account and Access configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          api() {
            curl --silent --show-error --fail \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" "$1"
          }

          accounts=$(api "https://api.cloudflare.com/client/v4/accounts")
          echo "$accounts" | jq -e '.success == true' >/dev/null

          echo "## Cloudflare Access discovery" >> "$GITHUB_STEP_SUMMARY"
          echo "Account names and IDs:" >> "$GITHUB_STEP_SUMMARY"
          echo "$accounts" | jq -r '.result[] | "- " + .name + " (ID: " + .id + ")"' >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r account_id; do
            [ -n "$account_id" ] || continue
            apps=$(api "https://api.cloudflare.com/client/v4/accounts/$account_id/access/apps")
            org=$(api "https://api.cloudflare.com/client/v4/accounts/$account_id/access/organizations")

            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Account $account_id" >> "$GITHUB_STEP_SUMMARY"
            echo "Existing Access applications (name, domain, type, ID):" >> "$GITHUB_STEP_SUMMARY"
            echo "$apps" | jq -r 'if .success then (.result[]? | "- " + (.name // "unnamed") + " | " + (.domain // "no-domain") + " | " + (.type // "unknown") + " | " + .id) else "API error: " + (.errors|tostring) end' >> "$GITHUB_STEP_SUMMARY"
            echo "Access team domain:" >> "$GITHUB_STEP_SUMMARY"
            echo "$org" | jq -r 'if .success then (.result.auth_domain // "not configured") else "API error: " + (.errors|tostring) end' >> "$GITHUB_STEP_SUMMARY"
          done < <(echo "$accounts" | jq -r '.result[].id')

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Discovery only: no Access applications, policies, or production settings were changed." >> "$GITHUB_STEP_SUMMARY"
