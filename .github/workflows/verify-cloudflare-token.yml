name: Verify Cloudflare API token

on:
  push:
    branches:
      - feature/ta2lk-agent-foundation
    paths:
      - .github/workflows/verify-cloudflare-token.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-token:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          fi

          response=$(curl --silent --show-error --fail \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)

          success=$(printf '%s' "$response" | jq -r '.success')
          status=$(printf '%s' "$response" | jq -r '.result.status // "unknown"')

          if [ "$success" != "true" ] || [ "$status" != "active" ]; then
            echo "::error::Cloudflare token verification did not return active status."
            printf '%s' "$response" | jq '{success, errors}'
            exit 1
          fi

          echo "Cloudflare API token is valid and active."
          echo "Token value and response secrets were not printed."
